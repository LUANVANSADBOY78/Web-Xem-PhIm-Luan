services:
  - type: web
    name: motchill-movie-watching
    runtime: node
    plan: starter
    buildCommand: npm ci --legacy-peer-deps && npm run build
    startCommand: npm start
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DATA_FILE
        value: /var/data/data.json
    disk:
      name: motchill-data
      mountPath: /var/data
      sizeGB: 1
