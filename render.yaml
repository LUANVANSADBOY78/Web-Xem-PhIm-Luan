services:
  - type: web
    name: van-luan-movie-watching
    runtime: node
    plan: free
    branch: main
    healthCheckPath: /api/health
    buildCommand: npm ci --legacy-peer-deps && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.19.0
      - key: HOST
        value: 0.0.0.0
      - key: DATA_FILE
        value: /tmp/van-luan-data.json
      - key: ADMIN_SETUP_TOKEN
        generateValue: true
